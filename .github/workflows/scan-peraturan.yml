name: Scan Peraturan Baru

on:
  schedule:
    - cron: '0 1 * * *'
    - cron: '0 9 * * *'
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Jalankan scan peraturan
        env:
          FIREBASE_URL: ${{ secrets.FIREBASE_URL }}
          FIREBASE_AUTH: ${{ secrets.FIREBASE_AUTH }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: node scan-peraturan.js 
